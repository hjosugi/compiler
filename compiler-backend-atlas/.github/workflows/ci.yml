name: compiler-lab-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm
      - name: Run frontend, KIR, LLVM, and native tests
        run: sh scripts/check.sh
      - name: Build and run the sample language
        run: |
          export PYTHONPATH="$PWD/toy-llvm-language/src"
          python3 -m kofumini.cli native-run toy-llvm-language/examples/choose.kofu -O2

