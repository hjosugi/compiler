[project]
name = "kofumini-compiler-lab"
version = "0.1.0"
description = "An educational compiler pipeline from a tiny language to LLVM IR"
requires-python = ">=3.11"

[project.scripts]
kofuc = "kofumini.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "toy-llvm-language/src"}

[tool.setuptools.packages.find]
where = ["toy-llvm-language/src"]

